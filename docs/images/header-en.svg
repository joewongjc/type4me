<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Type4Me — Voice Input for macOS" lang="en">
<title>Type4Me — Voice Input for macOS</title>
<defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .brand { font-size: 22px; font-weight: 700; fill: #131313; letter-spacing: -0.2px; }
    .badge { font-size: 13px; font-weight: 500; fill: #4D4D4D; }
    .h1 { font-weight: 800; fill: #131313; letter-spacing: -1px; }
    .sub { font-size: 19px; font-weight: 400; fill: #7A7A7A; }
    .pill { font-size: 14px; font-weight: 500; fill: #333333; }
    .cap-text { font-size: 19px; font-weight: 600; fill: #FFFFFF; }
    .tip { font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    .esc { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .ct { font-size: 19px; font-weight: 700; fill: #131313; }
    .cs { font-size: 13px; fill: #7A7A7A; }
    .mt { font-size: 16px; font-weight: 600; fill: #131313; }
    .md { font-size: 13px; fill: #9A9A9A; }
    .chip { font-size: 14px; font-weight: 600; fill: #1F3A24; }
    .rec { font-size: 12px; font-weight: 600; fill: #2F5FE0; }
    .foot { font-size: 13px; fill: #9A9A9A; letter-spacing: 0.4px; }
    .orb-spin { transform-origin: 0 0; animation: spin 7s linear infinite; }
    .orb-spin2 { transform-origin: 0 0; animation: spin 11s linear infinite reverse; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .wipe { animation: wipe 7s cubic-bezier(.4,0,.6,1) infinite; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    /* 0% is the fully revealed frame so static renderers show the whole sentence. */
    @keyframes wipe { 0%,38% { transform: translateX(var(--w)); } 40%,44% { transform: translateX(0); } 92%,100% { transform: translateX(var(--w)); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .orb-spin, .orb-spin2, .pulse, .wipe, .caret { animation: none; }
    }
  </style>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#000000" fill-opacity="0.055"/>
  </pattern>
  <linearGradient id="dotfade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="dotmask"><rect width="1200" height="600" fill="url(#dotfade)"/></mask>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
  </filter>
  <filter id="capShadow" x="-10%" y="-40%" width="120%" height="200%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
  </filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  <radialGradient id="orbBase" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#1A1F3A"/>
    <stop offset="1" stop-color="#030409"/>
  </radialGradient>
  <linearGradient id="orbRim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
  </linearGradient>
  <radialGradient id="cancelFill" cx="40%" cy="30%" r="80%">
    <stop offset="0" stop-color="#6B6B6B"/>
    <stop offset="1" stop-color="#2C2C2C"/>
  </radialGradient>
  <clipPath id="orbClip"><circle cx="0" cy="0" r="27"/></clipPath>
  <clipPath id="capClip"><rect x="64" y="418" width="576" height="72" rx="36"/></clipPath>
  <linearGradient id="activeRow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EEF3FF"/>
    <stop offset="1" stop-color="#F6F8FF"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1199" height="599" rx="24" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.08"/>
<rect x="1" y="1" width="1198" height="598" rx="24" fill="url(#dots)" mask="url(#dotmask)"/>
<g transform="translate(64,62)"><circle cx="16" cy="0" r="16" fill="#131313"/>
<rect x="6.8" y="-2.5" width="2.4" height="5" rx="1.2" fill="#FFFFFF"/>
<rect x="10.8" y="-4.5" width="2.4" height="9" rx="1.2" fill="#FFFFFF"/>
<rect x="14.8" y="-6.5" width="2.4" height="13" rx="1.2" fill="#FFFFFF"/>
<rect x="18.8" y="-4.0" width="2.4" height="8" rx="1.2" fill="#FFFFFF"/>
<rect x="22.8" y="-2.0" width="2.4" height="4" rx="1.2" fill="#FFFFFF"/>
<text x="44" y="8" class="brand">Type4Me</text></g>
<rect x="1033.2" y="46" width="102.8" height="30" rx="15" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.095"/>
<text x="1084.6" y="65.5" text-anchor="middle" class="badge">MIT License</text>
<rect x="939.6" y="46" width="85.6" height="30" rx="15" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.095"/>
<text x="982.4" y="65.5" text-anchor="middle" class="badge">macOS 14+</text>
<text x="62" y="196" class="h1" font-size="64">Say it. Shape it.</text>
<text x="64" y="246" class="sub">Voice input for macOS. Text streams in as you speak —</text>
<text x="64" y="276" class="sub">polish, translate, ask or act with one hotkey.</text>
<rect x="64.0" y="316" width="127.4" height="32" rx="16" fill="#F1F1F1"/>
<text x="127.7" y="337" text-anchor="middle" class="pill">Streaming ASR</text>
<rect x="199.4" y="316" width="120.4" height="32" rx="16" fill="#F1F1F1"/>
<text x="259.6" y="337" text-anchor="middle" class="pill">Local / Cloud</text>
<rect x="327.8" y="316" width="77.8" height="32" rx="16" fill="#F1F1F1"/>
<text x="366.7" y="337" text-anchor="middle" class="pill">8 Modes</text>
<rect x="413.6" y="316" width="108.9" height="32" rx="16" fill="#F1F1F1"/>
<text x="468.1" y="337" text-anchor="middle" class="pill">Vocab Skill</text>
<rect x="530.6" y="316" width="108.9" height="32" rx="16" fill="#F1F1F1"/>
<text x="585.0" y="337" text-anchor="middle" class="pill">Usage Stats</text>
<g filter="url(#capShadow)"><rect x="64" y="418" width="576" height="72" rx="36.0" fill="#111214" stroke="#262729" stroke-width="1.5"/></g>
<rect x="527.1" y="362" width="118.9" height="40" rx="12" fill="#111214" stroke="#262729"/>
<text x="543.1" y="387" class="tip">Cancel</text>
<rect x="594.0" y="371" width="38" height="22" rx="11" fill="#8A8A8A"/>
<text x="613.0" y="386.5" text-anchor="middle" class="esc">esc</text>
<g transform="translate(105,454.0)"><circle r="28" fill="url(#orbBase)"/><g clip-path="url(#orbClip)"><g class="orb-spin" filter="url(#blur6)"><ellipse cx="-6" cy="2" rx="17" ry="7" fill="#168DFF" opacity="0.95"/><ellipse cx="7" cy="-3" rx="14" ry="6" fill="#CE2CCB" opacity="0.85"/></g><g class="orb-spin2" filter="url(#blur3)"><ellipse cx="2" cy="4" rx="13" ry="4" fill="#956CFF" opacity="0.95"/><ellipse cx="-3" cy="-1" rx="9" ry="2.6" fill="#EAF4FF" opacity="0.9"/></g></g><circle r="27.5" fill="none" stroke="url(#orbRim)" stroke-width="1.6"/><ellipse cx="-8" cy="-15" rx="9" ry="4" fill="#fff" opacity="0.18"/></g>
<text x="148" y="461.0" class="cap-text">Streaming ASR, custom voice workflows.</text>
<g clip-path="url(#capClip)"><g class="wipe" style="--w:369px" transform="translate(369,0)"><rect x="146" y="420" width="576" height="68" fill="#111214"/><rect class="caret" x="148" y="442.0" width="2.5" height="24" rx="1.25" fill="#8FB4FF"/></g></g>
<g transform="translate(602,454.0)"><circle r="22" fill="url(#cancelFill)" stroke="#fff" stroke-opacity="0.28"/><path d="M -6.5 -6.5 L 6.5 6.5 M 6.5 -6.5 L -6.5 6.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
<g filter="url(#shadow)"><rect x="712" y="112" width="424" height="410" rx="20" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.075"/></g>
<text x="736" y="152" class="ct">My Modes</text>
<text x="736" y="174" class="cs">Start dictating anywhere with a hotkey</text>
<circle cx="1098" cy="156" r="16" fill="#F1F1F1"/>
<line x1="1090" y1="151" x2="1106" y2="151" stroke="#555555" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="1094" cy="151" r="2.2" fill="#F1F1F1" stroke="#555555" stroke-width="1.3"/>
<line x1="1090" y1="156" x2="1106" y2="156" stroke="#555555" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="1101" cy="156" r="2.2" fill="#F1F1F1" stroke="#555555" stroke-width="1.3"/>
<line x1="1090" y1="161" x2="1106" y2="161" stroke="#555555" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="1096" cy="161" r="2.2" fill="#F1F1F1" stroke="#555555" stroke-width="1.3"/>
<line x1="736" y1="194" x2="1112" y2="194" stroke="#000000" stroke-opacity="0.07"/>
<text x="736" y="227" class="mt">Quick Mode</text>
<text x="736" y="247" class="md">Raw transcript, fastest</text>
<rect x="1045.4" y="216.0" width="64.6" height="30" rx="15" fill="#EAF4EA" stroke="#CBE3CE"/>
<g transform="translate(1062.4,231.0)" fill="none" stroke="#3E8E4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4.6 -2.2 A 5 5 0 0 0 -4.4 -2"/><path d="M -4.6 2.2 A 5 5 0 0 0 4.4 2"/><path d="M -4.6 -4.6 L -4.4 -2 L -1.8 -2.2"/><path d="M 4.6 4.6 L 4.4 2 L 1.8 2.2"/></g>
<text x="1075.4" y="236.0" class="chip">fn</text>
<rect x="722" y="264" width="404" height="58" rx="14" fill="url(#activeRow)"/>
<text x="736" y="289" class="mt">Intelli Sense</text>
<circle class="pulse" cx="861.1" cy="283" r="4" fill="#3B6FF0"/>
<text x="870.1" y="287.5" class="rec">Recording</text>
<text x="736" y="309" class="md">Context-aware polish</text>
<rect x="1041.2" y="278.0" width="68.8" height="30" rx="15" fill="#EAF4EA" stroke="#CBE3CE"/>
<g transform="translate(1058.2,293.0)" fill="none" stroke="#3E8E4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4.6 -2.2 A 5 5 0 0 0 -4.4 -2"/><path d="M -4.6 2.2 A 5 5 0 0 0 4.4 2"/><path d="M -4.6 -4.6 L -4.4 -2 L -1.8 -2.2"/><path d="M 4.6 4.6 L 4.4 2 L 1.8 2.2"/></g>
<text x="1071.2" y="298.0" class="chip">⌥ 1</text>
<text x="736" y="351" class="mt">Translate</text>
<text x="736" y="371" class="md">Speak one, type another</text>
<rect x="1041.2" y="340.0" width="68.8" height="30" rx="15" fill="#EAF4EA" stroke="#CBE3CE"/>
<g transform="translate(1058.2,355.0)" fill="none" stroke="#3E8E4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4.6 -2.2 A 5 5 0 0 0 -4.4 -2"/><path d="M -4.6 2.2 A 5 5 0 0 0 4.4 2"/><path d="M -4.6 -4.6 L -4.4 -2 L -1.8 -2.2"/><path d="M 4.6 4.6 L 4.4 2 L 1.8 2.2"/></g>
<text x="1071.2" y="360.0" class="chip">⌥ 2</text>
<line x1="736" y1="386" x2="1112" y2="386" stroke="#000000" stroke-opacity="0.060000000000000005"/>
<text x="736" y="413" class="mt">Ask Anything</text>
<text x="736" y="433" class="md">Ask about the selection</text>
<rect x="1041.2" y="402.0" width="68.8" height="30" rx="15" fill="#EAF4EA" stroke="#CBE3CE"/>
<g transform="translate(1058.2,417.0)" fill="none" stroke="#3E8E4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4.6 -2.2 A 5 5 0 0 0 -4.4 -2"/><path d="M -4.6 2.2 A 5 5 0 0 0 4.4 2"/><path d="M -4.6 -4.6 L -4.4 -2 L -1.8 -2.2"/><path d="M 4.6 4.6 L 4.4 2 L 1.8 2.2"/></g>
<text x="1071.2" y="422.0" class="chip">⌥ 3</text>
<line x1="736" y1="448" x2="1112" y2="448" stroke="#000000" stroke-opacity="0.060000000000000005"/>
<text x="736" y="475" class="mt">Mac Actions</text>
<text x="736" y="495" class="md">Control your Mac by voice</text>
<rect x="1041.2" y="464.0" width="68.8" height="30" rx="15" fill="#EAF4EA" stroke="#CBE3CE"/>
<g transform="translate(1058.2,479.0)" fill="none" stroke="#3E8E4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M 4.6 -2.2 A 5 5 0 0 0 -4.4 -2"/><path d="M -4.6 2.2 A 5 5 0 0 0 4.4 2"/><path d="M -4.6 -4.6 L -4.4 -2 L -1.8 -2.2"/><path d="M 4.6 4.6 L 4.4 2 L 1.8 2.2"/></g>
<text x="1071.2" y="484.0" class="chip">⌥ 4</text>
<line x1="64" y1="538" x2="640" y2="538" stroke="#000000" stroke-opacity="0.07"/>
<text x="64" y="566" class="foot">github.com/joewongjc/type4me</text>
<text x="640" y="566" text-anchor="end" class="foot">Free · Open source · Your data stays local</text>
</svg>
